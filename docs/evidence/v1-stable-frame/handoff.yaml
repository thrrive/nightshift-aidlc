mission:
  ask: "finish aidlc stable v1. and then need to get back to the rearchitecture in the master plan"
  done_state: merged
  done_when:
    - Two complete external-repository missions succeed from one pinned public release candidate
    - The missions exercise at least one rewind and one human gate without changing the canonical contract
    - Upgrade and backward compatibility are documented and tested
    - Nightshift AIDLC v1.0.0 is merged, tagged, and published
    - The combined master plan records OSS7 complete and rearchitecture work resumes
  halts: []
outcome: advance
then: build
outputs:
  - docs/evidence/v1-stable-frame/mission.json
  - docs/evidence/v1-stable-frame/investigation.md
  - docs/evidence/v1-stable-frame/blueprint.md
  - docs/evidence/v1-stable-frame/plan.md
  - docs/evidence/v1-stable-frame/redteam-review.json
  - docs/evidence/v1-stable-frame/handoff.yaml
note: Publish an immutable release candidate before dogfood; the top risk is circular evidence from a mutable package tree.
blockers: []
review:
  schema_version: 1
  stage: redteam
  reviewed_subject:
    kind: blueprint-plan
    refs:
      - docs/evidence/v1-stable-frame/blueprint.md
      - docs/evidence/v1-stable-frame/plan.md
  reviewer_context: same-session
  parse_status: complete
  decision: PASS
  evidence_complete: true
  proof_ceiling: STATIC_ONLY
  lenses:
    - id: requirements-correctness
      status: complete
      note: Every OSS7 exit condition maps to an ordered step and retained artifact.
      evidence: [plan.md]
    - id: architecture-security
      status: complete
      note: The RC-first boundary prevents an untagged tree from masquerading as immutable evidence.
      evidence: [blueprint.md]
    - id: tests-oracles
      status: complete
      note: Frozen preview handoffs detect backward-incompatible schema drift; tagged host runs test portability.
      evidence: [plan.md]
    - id: delivery-operations
      status: complete
      note: Two ordered PRs preserve reviewability and allow rollback to the existing preview tag.
      evidence: [plan.md]
    - id: adversarial-lifecycle
      status: complete
      note: The plan rejects prior unpinned work as qualifying evidence and requires exact revisions for every mission.
      evidence: [investigation.md]
  claims:
    - id: stable-v1-plan
      tier: core
      statement: The plan can prove stable-v1 qualification without circular artifact evidence.
      boundary: OSS7 release flow
      required_proof: static
      state: STATIC_ONLY
      evidence: [blueprint.md, plan.md]
  findings: []
  residual_risks:
    - Behavioral portability remains unproven until the tagged external missions complete.
  outcome: advance
  note: The two-PR candidate-first release plan is coherent and ready for implementation.
rollout:
  target_environment: production
  deploy_path: GitHub annotated tags and releases
  verify_shape: Tagged package qualification in Claude Code and Codex against two external repositories
